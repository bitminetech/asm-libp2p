# Build every target with the pinned toolchain and check each library against
# the declared interface and frame rules, then on each of the 7 supported
# targets run the scenario runner and the shell loop test, run transport
# interop on each Linux ISA over TCP against 16 implementations and over
# quic-v1 against 12, run gossipsub interop in Shadow, and
# write the tick tables (ARCHITECTURE.md sections 1, 4, 7 and 10).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - name: Build and check all targets
        run: |
          docker build -t asm-libp2p-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" -w /src asm-libp2p-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: |
            build/
            !build/deps/

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "" }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "" }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run the scenarios and the shell loop test
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/runner build/linux-${{ matrix.isa }}/loop
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/runner | tee results-linux-${{ matrix.isa }}.txt
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/loop | tee -a results-linux-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}
          path: results-linux-${{ matrix.isa }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Run the scenarios and the shell loop test
        shell: pwsh
        run: |
          & "build/windows-${{ matrix.isa }}/runner.exe" | Tee-Object results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build/windows-${{ matrix.isa }}/loop.exe" | Tee-Object -Append results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}
          path: results-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Run the scenarios and the shell loop test
        run: |
          set -o pipefail
          tests/runner/macos.sh | tee results-macos-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}
          path: results-macos-${{ matrix.isa }}.txt

  # transport-interop of libp2p/test-plans over TCP: the node of each Linux ISA
  # against each of the 16 implementations that offer TCP with Noise, with
  # each muxer they offer, both directions, one job per ISA and implementation.
  # The RISC-V node runs under QEMU user mode on ARM64.
  interop-tcp:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        isa: [x86_64, arm64, riscv64]
        impl: [go-v0.46, go-v0.47, go-v0.48, dotnet-v1.0, node-js-v1.x, node-js-v2.x, node-js-v3.x,
               nim-v1.14, nim-v2.4, python-v0.x, jvm-libp2p-v1.3, c-v0.0.1,
               rust-v0.53, rust-v0.54, rust-v0.55, rust-v0.56]
    runs-on: ${{ matrix.isa == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Build the images
        run: |
          chmod +x build/linux-${{ matrix.isa }}/node
          tests/interop/build-images.sh ${{ matrix.isa }} "$RUNNER_TEMP" ${{ matrix.impl }}
      - name: Run the pairs
        run: |
          set -o pipefail
          TRANSPORT=tcp tests/interop/run.sh ${{ matrix.isa }} ${{ matrix.impl }} | tee interop-tcp-${{ matrix.isa }}-${{ matrix.impl }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: interop-tcp-${{ matrix.isa }}-${{ matrix.impl }}
          path: interop-tcp-${{ matrix.isa }}-${{ matrix.impl }}.txt

  # transport-interop of libp2p/test-plans over quic-v1: the node of each Linux
  # ISA against each of the 12 implementations, both directions, one job per
  # ISA and implementation. The RISC-V node runs under QEMU user mode on ARM64.
  interop-quic:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        isa: [x86_64, arm64, riscv64]
        impl: [go-v0.46, go-v0.47, go-v0.48, rust-v0.53, rust-v0.54, rust-v0.55, rust-v0.56,
               nim-v2.4, jvm-libp2p-v1.3, python-v0.x, c-v0.0.1, eth-p2p-z-v0.0.1]
    runs-on: ${{ matrix.isa == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Build the images
        run: |
          chmod +x build/linux-${{ matrix.isa }}/node
          tests/interop/build-images.sh ${{ matrix.isa }} "$RUNNER_TEMP" ${{ matrix.impl }}
      - name: Run the pairs
        run: |
          set -o pipefail
          TRANSPORT=quic-v1 tests/interop/run.sh ${{ matrix.isa }} ${{ matrix.impl }} | tee interop-quic-${{ matrix.isa }}-${{ matrix.impl }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: interop-quic-${{ matrix.isa }}-${{ matrix.impl }}
          path: interop-quic-${{ matrix.isa }}-${{ matrix.impl }}.txt

  # Count the transport-interop pairs of each transport and ISA. TCP: 16
  # implementations, each muxer they offer, both directions, so 56 must pass
  # on each ISA. quic-v1: 12 implementations, both directions, so 24.
  interop-results:
    needs: [interop-tcp, interop-quic]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: interop-*, path: interop, merge-multiple: true }
      - name: Count the pairs
        run: |
          status=0
          {
            echo "| Transport | ISA | Passed | Failed | Needed |"
            echo "|---|---|---|---|---|"
            for t in tcp:56 quic:24; do
              tr=${t%%:*} need=${t#*:}
              for isa in x86_64 arm64 riscv64; do
                lines=$(cat interop/interop-$tr-$isa-*.txt 2>/dev/null || true)
                p=$(printf '%s\n' "$lines" | grep -c '^PASS ' || true)
                f=$(printf '%s\n' "$lines" | grep -c '^FAIL ' || true)
                echo "| $tr | $isa | $p | $f | $need |"
                [ "$p" = "$need" ] || status=1
              done
            done
            echo
            for file in interop/*.txt; do
              [ -e "$file" ] || continue
              grep '^FAIL ' "$file" | sed "s|^|- $(basename "$file" .txt): |" || true
            done
          } > summary.md
          cat summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # gossipsub-interop of libp2p/test-plans in the Shadow simulator, which runs
  # only on Linux x86-64: 32 nodes of asm-libp2p alone, of go-libp2p alone,
  # of asm-libp2p with each of go-libp2p, rust-libp2p, jvm-libp2p and
  # nim-libp2p, and of all five.
  gossipsub:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SHADOW_COMMIT: 5a05740bad995b6dbb90b8a16effecf59eceee09     # v3.3.0
      GO_VERSION: 1.24.1                                          # go.mod of the go node
      RUST_VERSION: 1.100.0
      NIM_VERSION: 2.2.10                                         # tested by nim-libp2p 22ab040
      NIM_SHA256: 0a3a38752e97e9d44aa479b3a7b37336dfe0176daf22ee5b5218ad0991ecd211
      UV_VERSION: 0.13.6
      UV_SHA256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: Install the toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake findutils g++ gcc libc-dbg libclang-dev libglib2.0-0 libglib2.0-dev \
            make netbase python3 python3-networkx util-linux xz-utils
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/nim.tar.xz" "https://nim-lang.org/download/nim-$NIM_VERSION-linux_x64.tar.xz"
          echo "$NIM_SHA256  $RUNNER_TEMP/nim.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/nim.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nim-$NIM_VERSION/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$HOME/shadow/bin" >> "$GITHUB_PATH"
      - id: shadow
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/shadow
          key: shadow-${{ env.SHADOW_COMMIT }}-${{ env.RUST_VERSION }}
      - name: Build Shadow
        if: steps.shadow.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/shadow-src"
          cd "$RUNNER_TEMP/shadow-src"
          git fetch -q --depth 1 https://github.com/shadow/shadow "$SHADOW_COMMIT"
          git checkout -q FETCH_HEAD
          ./setup build --clean --prefix "$HOME/shadow"
          ./setup install
      - name: Build the nodes
        run: tests/gossipsub/build.sh "$RUNNER_TEMP/gs"
      - name: Run the compositions
        run: |
          set -o pipefail
          shadow --version
          tests/gossipsub/run.sh "$RUNNER_TEMP/gs" | tee "$RUNNER_TEMP/gs/results.txt"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gossipsub
          retention-days: 14
          path: |
            ${{ runner.temp }}/gs/results.txt
            ${{ runner.temp }}/gs/*.log
            ${{ runner.temp }}/gs/*.check
            ${{ runner.temp }}/gs/test-plans/gossipsub-interop/shadow-outputs/*/plots/analysis.txt
            ${{ runner.temp }}/gs/test-plans/gossipsub-interop/shadow-outputs/*/shadow.yaml
            ${{ runner.temp }}/gs/test-plans/gossipsub-interop/shadow-outputs/*/params.json
            ${{ runner.temp }}/gs/test-plans/gossipsub-interop/shadow-outputs/*/hosts/*/*.stdout
            ${{ runner.temp }}/gs/test-plans/gossipsub-interop/shadow-outputs/*/hosts/*/*.stderr

  # Write the tick tables into docs/reference/ from the results of every target.
  # On a push to main, commit them when they changed. When main has moved on,
  # the push is skipped: the newer run writes the tables then.
  results:
    needs: [build, linux, windows, macos, interop-tcp, interop-quic, interop-results, gossipsub]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: results-*, path: results, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: build, path: build }
      - name: Write the tick tables
        run: python3 -I tests/runner/tick_tables.py results build
      - name: Write the verification heatmap
        run: python3 -I tests/runner/heatmap.py
      - name: Write the README panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub answers pages of 100 jobs of a large run with HTTP 502, so take 50 at a
          # time and try 3 times. Without the jobs, the CI panel stays as it was and the
          # tick tables are still committed.
          got=""
          for try in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json" &&
               gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
                   --jq '.jobs[] | tojson' > "$RUNNER_TEMP/jobs.jsonl"; then
              got=1
              break
            fi
            sleep 15
          done
          if [ -n "$got" ]; then
            python3 -I tests/runner/panels.py "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.jsonl"
          else
            echo "GitHub did not give the jobs of this run, so the CI panel stays as it was."
            python3 -I tests/runner/panels.py
          fi
      - name: Commit the tick tables and README panels
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/reference docs/heatmap docs/readme README.md
          if git diff --cached --quiet; then echo "The tick tables and README panels did not change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the tick tables and README panels"
          if ! git push origin HEAD:main; then
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ] || exit 1
            echo "main has moved on, so this run does not update the tick tables or README panels."
          fi
